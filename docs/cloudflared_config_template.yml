# Cloudflared Config 更新模板 (Windows)
# 文件路径: %USERPROFILE%\.cloudflared\config.yml

# 隧道ID: 请替换为新账号下创建的隧道ID
tunnel: <新隧道ID>
credentials-file: C:\Users\<你的用户名>\.cloudflared\<新隧道ID>.json

# 入口规则
ingress:
  # 新追踪域名
  - hostname: track.louisliu.fun
    service: http://localhost:8000
  # 其他域名如果有的话可以在这里添加
  # - hostname: other.yourdomain.com
  #   service: http://localhost:其他端口
  # 默认404
  - service: http_status:404
